<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка бронирования</title>
    <link rel="stylesheet" href="booking.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="booking-card">
            <div class="time-box">
                <div class="date">17 НОЯ ВТ</div>
                <div class="time">10:20 - 11:50</div>
            </div>
            <div class="info-block">
                <h2 class="title">Аудитория 212</h2>
                <div class="meta">2 этаж   15 участников</div>
                <div class="desc">Проектная работа</div>
            </div>
            <div class="status-block">
                <div class="status-text">Подтверждено</div>
                <div class="request-id">Заявка № 1265</div>
            </div>
            <div class="actions-block">
                <button class="btn-change">Изменить время</button>
                <button class="btn-cancel">Отменить бронь</button>
            </div>
        </div>
    </div>
</body>
</html>
